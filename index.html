<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline de Dados End-to-End — Vertical</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0f17;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .frame {
    width: 100%;
    max-width: 900px;
    background: radial-gradient(800px 500px at 15% -10%, #16233a 0%, transparent 60%),
                radial-gradient(700px 400px at 110% 110%, #1a1430 0%, transparent 55%),
                #0b0f17;
    border: 1px solid #1d2635;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);
  }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 860 1580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151d2c"/>
      <stop offset="100%" stop-color="#101725"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fa0ff"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff7dd2"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5c5c"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fd8e8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb347"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98ad" opacity="0.7"/>
    </marker>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- HEADER -->
  <text x="22" y="34" fill="#e6edf7" font-size="18" font-weight="600">⚙️ Pipeline de Dados End-to-End</text>
  <text x="22" y="56" fill="#8b98ad" font-size="11.5" font-family="ui-monospace, Consolas, monospace">
    Fontes → OLTP → Mensageria → Data Lake → Processamento → Databricks → BI
  </text>

  <!-- LEGEND -->
  <g transform="translate(22, 78)" font-size="10.5" fill="#8b98ad">
    <circle cx="0" cy="5" r="4" fill="#4fa0ff"/><text x="11" y="9">Pipelines</text>
    <circle cx="80" cy="5" r="4" fill="#3ddc84"/><text x="91" y="9">Dados</text>
    <circle cx="150" cy="5" r="4" fill="#ff8d41"/><text x="161" y="9">Microsserviços</text>
    <circle cx="260" cy="5" r="4" fill="#ff7dd2"/><text x="271" y="9">Mensageria</text>
  </g>

  <!-- ================= 1. FONTES ================= -->
  <g>
    <rect x="22" y="110" width="816" height="200" rx="12" fill="rgba(19,28,43,0.45)" stroke="#1d2635"/>
    <text x="40" y="138" fill="#5f6b80" font-size="10" font-weight="700" letter-spacing="2" font-family="ui-monospace, Consolas, monospace">FONTES DE DADOS</text>

    <!-- Corporativas -->
    <g transform="translate(40, 155)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#cardGrad)" stroke="#b48cff" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="0" y="0" width="150" height="3" rx="1.5" fill="#b48cff"/>
      <text x="75" y="26" text-anchor="middle" fill="#e6edf7" font-size="11.5" font-weight="600">Corporativas</text>
      <text x="75" y="42" text-anchor="middle" fill="#b48cff" font-size="9.5" font-family="ui-monospace, Consolas, monospace">ERP / CRM SaaS</text>
      <text x="75" y="55" text-anchor="middle" fill="#8b98ad" font-size="9">Salesforce, SAP</text>
    </g>
    <!-- Web -->
    <g transform="translate(205, 155)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#cardGrad)" stroke="#4fa0ff" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="0" y="0" width="150" height="3" rx="1.5" fill="#4fa0ff"/>
      <text x="75" y="26" text-anchor="middle" fill="#e6edf7" font-size="11.5" font-weight="600">Aplicações Web</text>
      <text x="75" y="42" text-anchor="middle" fill="#4fa0ff" font-size="9.5" font-family="ui-monospace, Consolas, monospace">Portal / Front-End</text>
      <text x="75" y="55" text-anchor="middle" fill="#8b98ad" font-size="9">React, Angular</text>
    </g>
    <!-- Java -->
    <g transform="translate(370, 155)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#cardGrad)" stroke="#ff8d41" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="0" y="0" width="150" height="3" rx="1.5" fill="#ff8d41"/>
      <text x="75" y="26" text-anchor="middle" fill="#e6edf7" font-size="11.5" font-weight="600">Java Microsserviços</text>
      <text x="75" y="42" text-anchor="middle" fill="#ff8d41" font-size="9.5" font-family="ui-monospace, Consolas, monospace">Spring Boot / REST</text>
      <text x="75" y="55" text-anchor="middle" fill="#8b98ad" font-size="9">Kafka, Eventos, gRPC</text>
    </g>
    <!-- Batch -->
    <g transform="translate(535, 155)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#cardGrad)" stroke="#ffb347" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="0" y="0" width="150" height="3" rx="1.5" fill="#ffb347"/>
      <text x="75" y="26" text-anchor="middle" fill="#e6edf7" font-size="11.5" font-weight="600">CRON / Batch</text>
      <text x="75" y="42" text-anchor="middle" fill="#ffb347" font-size="9.5" font-family="ui-monospace, Consolas, monospace">Arquivos Legados</text>
      <text x="75" y="55" text-anchor="middle" fill="#8b98ad" font-size="9">CSV, XML, S3</text>
    </g>
    <!-- Mobile -->
    <g transform="translate(700, 155)">
      <rect x="0" y="0" width="120" height="60" rx="8" fill="url(#cardGrad)" stroke="#3ddc84" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="0" y="0" width="120" height="3" rx="1.5" fill="#3ddc84"/>
      <text x="60" y="26" text-anchor="middle" fill="#e6edf7" font-size="11.5" font-weight="600">Mobile / IoT</text>
      <text x="60" y="42" text-anchor="middle" fill="#3ddc84" font-size="9.5" font-family="ui-monospace, Consolas, monospace">App iOS/Android</text>
      <text x="60" y="55" text-anchor="middle" fill="#8b98ad" font-size="9">SQLite local</text>
    </g>

    <!-- 4 tipos de dados -->
    <g transform="translate(40, 232)">
      <text x="0" y="0" fill="#8b98ad" font-size="9" font-weight="700" letter-spacing="1" font-family="ui-monospace, Consolas, monospace">OS 4 TIPOS DE DADOS EM UMA ORGANIZAÇÃO</text>
      <g transform="translate(0, 8)">
        <rect x="0" y="0" width="180" height="22" rx="5" fill="rgba(0,0,0,.3)" stroke="#2a3446"/>
        <rect x="0" y="0" width="3" height="22" rx="1.5" fill="#4fa0ff"/>
        <text x="12" y="15" fill="#e6edf7" font-size="10" font-weight="600">Transacionais</text>
        <text x="170" y="15" fill="#8b98ad" font-size="9" text-anchor="end" font-family="ui-monospace, Consolas, monospace">OLTP</text>
      </g>
      <g transform="translate(195, 8)">
        <rect x="0" y="0" width="180" height="22" rx="5" fill="rgba(0,0,0,.3)" stroke="#2a3446"/>
        <rect x="0" y="0" width="3" height="22" rx="1.5" fill="#ffd166"/>
        <text x="12" y="15" fill="#e6edf7" font-size="10" font-weight="600">Mestres</text>
        <text x="170" y="15" fill="#8b98ad" font-size="9" text-anchor="end" font-family="ui-monospace, Consolas, monospace">MDM/ERP</text>
      </g>
      <g transform="translate(390, 8)">
        <rect x="0" y="0" width="180" height="22" rx="5" fill="rgba(0,0,0,.3)" stroke="#2a3446"/>
        <rect x="0" y="0" width="3" height="22" rx="1.5" fill="#4fd8e8"/>
        <text x="12" y="15" fill="#e6edf7" font-size="10" font-weight="600">Referência</text>
        <text x="170" y="15" fill="#8b98ad" font-size="9" text-anchor="end" font-family="ui-monospace, Consolas, monospace">Apoio</text>
      </g>
      <g transform="translate(585, 8)">
        <rect x="0" y="0" width="180" height="22" rx="5" fill="rgba(0,0,0,.3)" stroke="#2a3446"/>
        <rect x="0" y="0" width="3" height="22" rx="1.5" fill="#3ddc84"/>
        <text x="12" y="15" fill="#e6edf7" font-size="10" font-weight="600">Analíticos</text>
        <text x="170" y="15" fill="#8b98ad" font-size="9" text-anchor="end" font-family="ui-monospace, Consolas, monospace">DW/Lake</text>
      </g>
    </g>
  </g>

  <!-- Seta Fontes → Gateway -->
  <path d="M 430 318 L 430 348" stroke="#4fa0ff" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)" opacity="0.9"/>
  <text x="445" y="336" fill="#6b7a90" font-size="9.5" font-family="ui-monospace, Consolas, monospace">ELT / CDC</text>

  <!-- ================= 2. GATEWAY ================= -->
  <g transform="translate(315, 355)">
    <rect x="0" y="0" width="230" height="58" rx="10" fill="url(#cardGrad)" stroke="#4fa0ff" stroke-opacity="0.85" stroke-width="1.5" filter="url(#glowBlue)"/>
    <rect x="0" y="0" width="230" height="3.5" rx="1.75" fill="#4fa0ff"/>
    <text x="115" y="28" text-anchor="middle" fill="#e6edf7" font-size="13" font-weight="600">API Gateway</text>
    <text x="115" y="46" text-anchor="middle" fill="#4fa0ff" font-size="10" font-family="ui-monospace, Consolas, monospace">Load Balancer</text>
  </g>

  <!-- Seta Gateway → OLTP -->
  <path d="M 430 418 L 430 448" stroke="#4fa0ff" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)" opacity="0.9"/>

  <!-- ================= 3. OLTP ================= -->
  <g>
    <rect x="115" y="455" width="630" height="150" rx="12" fill="url(#cardGrad)" stroke="#4fa0ff" stroke-opacity="0.6" stroke-width="1.3"/>
    <rect x="115" y="455" width="630" height="3.5" rx="1.75" fill="#4fa0ff"/>
    <text x="135" y="478" fill="#4fa0ff" font-size="10" font-weight="700" font-family="ui-monospace, Consolas, monospace" letter-spacing="1">CAMADA OPERACIONAL (OLTP)</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d4e5">
      <text x="135" y="505">┌───────────────────────────────┐   ┌──────────────────────────────┐</text>
      <text x="135" y="521">│  SGBD Cliente-Servidor        │   │  - Alta Normalização         │</text>
      <text x="135" y="537">│  - PostgreSQL / MySQL         │   │  - Propriedades ACID         │</text>
      <text x="135" y="553">│  - MongoDB (NoSQL Documento)  │   │  - Mecanismo WAL (Log)       │</text>
      <text x="135" y="569">│  - Oracle / SQL Server / DB2  │   │  - Integridade Referencial   │</text>
      <text x="135" y="585">└───────────────────────────────┘   └──────────────────────────────┘</text>
    </g>
  </g>

  <!-- Seta OLTP → Mensageria -->
  <path d="M 430 608 L 430 640" stroke="#ff7dd2" stroke-width="2.2" fill="none" marker-end="url(#arrowPink)" opacity="0.9"/>
  <text x="445" y="628" fill="#6b7a90" font-size="9.5" font-family="ui-monospace, Consolas, monospace">CDC / eventos</text>

  <!-- ================= 4. MENSAGERIA ================= -->
  <g>
    <rect x="115" y="647" width="630" height="150" rx="12" fill="url(#cardGrad)" stroke="#ff7dd2" stroke-opacity="0.6" stroke-width="1.3"/>
    <rect x="115" y="647" width="630" height="3.5" rx="1.75" fill="#ff7dd2"/>
    <text x="135" y="670" fill="#ff7dd2" font-size="10" font-weight="700" font-family="ui-monospace, Consolas, monospace" letter-spacing="1">CAMADA DE MENSAGERIA / STREAMING</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d4e5">
      <text x="135" y="697">┌───────────────────────────────┐   ┌──────────────────────────────┐</text>
      <text x="135" y="713">│  BROKERS DE EVENTOS           │   │  - AWS SQS / SNS             │</text>
      <text x="135" y="729">│  - Apache Kafka               │   │  - Google Pub/Sub            │</text>
      <text x="135" y="745">│  - RabbitMQ / Apache Pulsar   │   │  - Redis Streams             │</text>
      <text x="135" y="761">│  - Filas duráveis             │   │  - Pub/Sub assíncrono        │</text>
      <text x="135" y="777">└───────────────────────────────┘   └──────────────────────────────┘</text>
    </g>
  </g>

  <!-- Seta Mensageria → Data Lake -->
  <path d="M 430 800 L 430 832" stroke="#ff7dd2" stroke-width="2.2" fill="none" marker-end="url(#arrowPink)" opacity="0.9"/>
  <text x="445" y="820" fill="#6b7a90" font-size="9.5" font-family="ui-monospace, Consolas, monospace">ingestão contínua</text>

  <!-- ================= 5. DATA LAKE ================= -->
  <g>
    <rect x="115" y="839" width="630" height="170" rx="12" fill="url(#cardGrad)" stroke="#4fd8e8" stroke-opacity="0.6" stroke-width="1.3"/>
    <rect x="115" y="839" width="630" height="3.5" rx="1.75" fill="#4fd8e8"/>
    <text x="135" y="862" fill="#4fd8e8" font-size="10" font-weight="700" font-family="ui-monospace, Consolas, monospace" letter-spacing="1">CAMADA DE BIG DATA — DATA LAKE</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d4e5">
      <text x="135" y="889">┌───────────────────────────────┐   ┌──────────────────────────────┐</text>
      <text x="135" y="905">│  DATA LAKE (AWS S3 / GCS)     │   │  FERRAMENTAS POPULARES       │</text>
      <text x="135" y="921">│  - Dados Brutos               │   │  - Apache Iceberg            │</text>
      <text x="135" y="937">│  - Schema-on-Read             │   │  - Delta Lake                │</text>
      <text x="135" y="953">│  - JSON / CSV / Logs          │   │  - Apache Hudi / Paimon      │</text>
      <text x="135" y="969">└───────────────────────────────┘   └──────────────────────────────┘</text>
    </g>
  </g>

  <!-- Seta Data Lake → Processamento -->
  <path d="M 430 1012 L 430 1044" stroke="#4fd8e8" stroke-width="2.2" fill="none" marker-end="url(#arrowCyan)" opacity="0.9"/>
  <text x="445" y="1032" fill="#6b7a90" font-size="9.5" font-family="ui-monospace, Consolas, monospace">leitura distribuída</text>

  <!-- ================= 6. PROCESSAMENTO (SPARK) ================= -->
  <g>
    <rect x="115" y="1051" width="630" height="130" rx="12" fill="url(#cardGrad)" stroke="#ffb347" stroke-opacity="0.75" stroke-width="1.4" filter="url(#glowAmber)"/>
    <rect x="115" y="1051" width="630" height="3.5" rx="1.75" fill="#ffb347"/>
    <text x="135" y="1074" fill="#ffb347" font-size="10" font-weight="700" font-family="ui-monospace, Consolas, monospace" letter-spacing="1">CAMADA DE PROCESSAMENTO</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d4e5">
      <text x="135" y="1101">┌───────────────────────────────┐   ┌──────────────────────────────┐</text>
      <text x="135" y="1117">│  Apache Spark                 │   │  - Spark SQL / MLlib         │</text>
      <text x="135" y="1133">│  - Batch + Streaming          │   │  - Apache Flink              │</text>
      <text x="135" y="1149">│  - Engine unificada           │   │  - Kafka Streams             │</text>
      <text x="135" y="1165">└───────────────────────────────┘   └──────────────────────────────┘</text>
    </g>
  </g>

  <!-- Seta Processamento → Databricks -->
  <path d="M 430 1184 L 430 1216" stroke="#ffb347" stroke-width="2.2" fill="none" marker-end="url(#arrowAmber)" opacity="0.9"/>
  <text x="445" y="1204" fill="#6b7a90" font-size="9.5" font-family="ui-monospace, Consolas, monospace">Delta / Spark</text>

  <!-- ================= 7. DATABRICKS ================= -->
  <g>
    <rect x="115" y="1223" width="630" height="150" rx="12" fill="url(#cardGrad)" stroke="#ff5c5c" stroke-opacity="0.75" stroke-width="1.4" filter="url(#glowRed)"/>
    <rect x="115" y="1223" width="630" height="3.5" rx="1.75" fill="#ff5c5c"/>
    <text x="135" y="1246" fill="#ff5c5c" font-size="10" font-weight="700" font-family="ui-monospace, Consolas, monospace" letter-spacing="1">CAMADA DE DATA LAKEHOUSE — DATABRICKS</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d4e5">
      <text x="135" y="1273">┌───────────────────────────────┐   ┌──────────────────────────────┐</text>
      <text x="135" y="1289">│  DATABRICKS                   │   │  - Databricks SQL (DBSQL)    │</text>
      <text x="135" y="1305">│  - Unified Data Platform      │   │  - Unity Catalog             │</text>
      <text x="135" y="1321">│  - Delta Lake Engine          │   │  - MLflow / MLOps            │</text>
      <text x="135" y="1337">│  - Spark + Photon             │   │  - Governança de dados       │</text>
      <text x="135" y="1353">└───────────────────────────────┘   └──────────────────────────────┘</text>
    </g>
  </g>

  <!-- Seta Databricks → BI -->
  <path d="M 430 1376 L 430 1408" stroke="#ff5c5c" stroke-width="2.2" fill="none" marker-end="url(#arrowRed)" opacity="0.9"/>
  <text x="445" y="1396" fill="#6b7a90" font-size="9.5" font-family="ui-monospace, Consolas, monospace">consultas SQL</text>

  <!-- ================= 8. BI ================= -->
  <g>
    <rect x="115" y="1415" width="630" height="130" rx="12" fill="url(#cardGrad)" stroke="#4fa0ff" stroke-opacity="0.75" stroke-width="1.4" filter="url(#glowBlue)"/>
    <rect x="115" y="1415" width="630" height="3.5" rx="1.75" fill="#4fa0ff"/>
    <text x="135" y="1438" fill="#4fa0ff" font-size="10" font-weight="700" font-family="ui-monospace, Consolas, monospace" letter-spacing="1">BUSINESS INTELLIGENCE</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d4e5">
      <text x="135" y="1465">┌───────────────────────────────┐   ┌──────────────────────────────┐</text>
      <text x="135" y="1481">│  Power BI / Tableau           │   │  - Métricas de Acurácia      │</text>
      <text x="135" y="1497">│  - Dashboards Visuais         │   │  - Tomada de Decisão         │</text>
      <text x="135" y="1513">└───────────────────────────────┘   └──────────────────────────────┘</text>
    </g>
  </g>

  <!-- FOOTER -->
  <text x="430" y="1570" text-anchor="middle" fill="#4a5568" font-size="10" font-family="ui-monospace, Consolas, monospace">
    Pipeline de Dados End-to-End · Fontes → OLTP → Mensageria → Data Lake → Processamento → Databricks → BI
  </text>
</svg>
</div>
</body>
</html>
